# Copied from blufire-platform/templates/app. Replace the two REPLACE values; everything else comes from repo variables
# set by bootstrap/40-github-oidc.sh (ACR_NAME, AZURE_BUILDS_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID).
# App repos hold no platform secrets: they only push images.
name: build
on:
  push: { branches: [main] }
  pull_request: {}
permissions: { contents: read, id-token: write }
jobs:
  build:
    uses: REPLACE-github-org/blufire-platform/.github/workflows/reusable-app-build.yml@main
    with:
      client: REPLACE-client-id
      app: REPLACE-app-id
      platform_repo: REPLACE-github-org/blufire-platform
      acr_name: ${{ vars.ACR_NAME }}
      azure_client_id: ${{ vars.AZURE_BUILDS_CLIENT_ID }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
