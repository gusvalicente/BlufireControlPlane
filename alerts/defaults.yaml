# Defaults applied when an app file does not override them. Low risk: edits commit directly.
app_alerts:
  latency_p95_ms: 1500
  error_rate_pct: 2
availability_test:
  frequency_seconds: 900      # 15 minutes
  locations: 5
  prod_only: true
remediation_sla_days:
  critical: 7
  high: 30
  medium: 90
digest:
  include_p3: true
  recipients: []              # empty = platform.yaml alerts.email
heartbeat:
  stale_after_minutes: 20     # Mac Mini alerts when the platform heartbeat is older than this
