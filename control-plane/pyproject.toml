[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "blufire-control-plane"
version = "0.1.0"
description = "BluFire platform control plane: platform-api, worker jobs and MCP server"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "ruamel.yaml>=0.18",
  "jsonschema>=4.22",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "azure-identity>=1.17",
  "azure-storage-blob>=12.20",
  "azure-monitor-opentelemetry>=1.6",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9",
  "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
blufire-api = "blufire_cp.api.main:run"
blufire-worker = "blufire_cp.worker.main:main"
blufire-mcp = "blufire_cp.mcp_server:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blufire_cp = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S105", "S106", "B008", "E501"]  # E501: the formatter owns line length

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
